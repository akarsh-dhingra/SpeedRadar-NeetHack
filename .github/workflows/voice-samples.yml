# Voice audition for the demo film: expressive open-source TTS rendered in the cloud (not on team laptops).
# Output: the "voice-samples" artifact.
name: voice-samples

on:
  push:
    branches: [demo-video]
    paths: ["demo-video/voice/**", ".github/workflows/voice-samples.yml"]
  workflow_dispatch:

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: demo-video/voice } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chatterbox (CPU torch)
        run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts edge-tts
      - name: Female reference clips (Edge neural voices)
        run: python refs.py
      - name: Render samples
        run: python samples.py
      - name: Also as mp3
        run: for f in samples/*.wav; do ffmpeg -y -loglevel error -i "$f" -b:a 160k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: |
            demo-video/voice/samples
            demo-video/voice/refs/*.mp3
          retention-days: 7
