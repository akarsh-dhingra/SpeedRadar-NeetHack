# Voice audition for the demo film: expressive open-source TTS rendered in the cloud (not on team laptops).
# Output: the "voice-samples" artifact.
name: voice-samples

# Auditions are run by hand now that the voice is chosen (reader 1673).
on:
  workflow_dispatch:

jobs:
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: demo-video/voice } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chatterbox (CPU torch)
        run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts librosa soundfile
      - name: Real female readers (LibriSpeech dev-clean, CC BY 4.0)
        run: |
          curl -sSfL https://openslr.elda.org/resources/12/dev-clean.tar.gz -o dev-clean.tar.gz || curl -sSfL https://openslr.trmal.net/resources/12/dev-clean.tar.gz -o dev-clean.tar.gz
          tar xzf dev-clean.tar.gz
          python refs.py 6
      - name: Render samples
        run: python samples.py
      - name: Also as mp3
        run: for f in samples/*.wav; do ffmpeg -y -loglevel error -i "$f" -b:a 160k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: |
            demo-video/voice/samples
            demo-video/voice/refs/*.mp3
            demo-video/voice/refs/chosen.json
          retention-days: 7
