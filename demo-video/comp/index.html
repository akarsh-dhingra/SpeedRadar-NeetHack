<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spend Radar film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bangers&family=Geist+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// render.mjs injects window.__TL (timeline) and window.__CLIPS (site clip frame counts) before this runs.
window.__fontsReady = Promise.all([
  document.fonts.load("700 40px Fredoka"), document.fonts.load("600 40px Fredoka"), document.fonts.load("500 40px Fredoka"),
  document.fonts.load("400 40px Bangers"), document.fonts.load("500 40px 'Geist Mono'")
]).then(() => document.fonts.ready);
</script>
<script src="comp.js"></script>
</body>
</html>
