[project]
name = "spendradar"
version = "0.1.0"
description = "Spend Radar — competitor people-spend agent that audits its own findings (neatHack 2026)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "neatlogs[google-genai]",
    "google-genai>=1.55.0",
    "markdown>=3.11",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spendradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
